    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {

                            accent: '#2dd4bf',
                        }
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --arabic-size: 1.875rem;
            --bengali-size: 1rem;
        }
        
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease;
        }
        
        .dark body {
            background-color: #020617;
        }

        .arabic {
            font-family: 'Amiri', serif;
            direction: rtl;
            font-size: var(--arabic-size) !important;
        }

        .bengali-text {
            font-size: var(--bengali-size) !important;
        }

        #root {
            min-height: 100vh;
        }

        /* Hide scrollbars but keep functionality */
        .scroll-hide::-webkit-scrollbar {
            display: none;
        }
        .scroll-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
